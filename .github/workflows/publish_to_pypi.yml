name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/zeyrek/
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v7

    - name: Set up uv
      uses: astral-sh/setup-uv@v7

    - name: Build
      run: uv build

    - name: Publish to PyPI
      run: uv publish
