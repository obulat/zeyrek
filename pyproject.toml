[project]
name = "zeyrek"
version = "0.1.4-alpha"
description = "Python morphological analyzer and lemmatizer for Turkish"
authors = [
    {name = "Olga Bulat", email = "obulat@gmail.com"},
]
dependencies = [
    "nltk>=3.8.1",
]

requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/obulat/zeyrek"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "bumpver>=2023.1129",
]
docs = [
    "sphinx>=7.3.7",
    "furo>=2024.5.6",
    "myst-parser>=3.0.1",
    "sphinx-autobuild>=2024.4.16",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.bumpver]
current_version = "0.1.4-alpha"
version_pattern = "MAJOR.MINOR.PATCH-[alpha|beta|rc|final]"
commit_message = "bump version {old_version} -> {new_version}"
tag_message = "{new_version}"
tag_scope = "default"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
    'current_version = "{version}"',
]
"docs/conf.py" = [
    'version = "{version}"',
    'release = "{version}"',
]
