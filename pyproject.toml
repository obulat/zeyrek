[project]
name = "zeyrek"
version = "0.1.4a0"
description = "Python morphological analyzer and lemmatizer for Turkish"
authors = [
    {name = "Olga Bulat", email = "obulat@gmail.com"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["turkish", "nlp", "morphology", "lemmatizer", "morphological-analysis", "zemberek"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "nltk>=3.9",
]

[project.urls]
Homepage = "https://github.com/obulat/zeyrek"
Documentation = "https://zeyrek.readthedocs.io"
Source = "https://github.com/obulat/zeyrek"
Issues = "https://github.com/obulat/zeyrek/issues"
Changelog = "https://github.com/obulat/zeyrek/releases"

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=7",
    "ruff>=0.17.6",
]
docs = [
    "sphinx>=7.3.7",
    "furo>=2024.5.6",
    "myst-parser>=3.0.1",
    "sphinx-autobuild>=2024.4.16",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--cov=zeyrek --cov-report=term-missing --cov-report=xml"
